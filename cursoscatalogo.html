<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Catálogo - INESCAFÉ</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/menu.css" />
    <link rel="stylesheet" href="./css/cursoscatalogo.css">
</head>

<body>
    <div class="header-container">
        <img src="./img/INESCAFÉ (1).svg" alt="Logo INESCafé" class="logo" />

        <div class="header-nav-line">
            <nav>
                <ul>
                    <li><a href="./home.html">Home</a></li>
                    <li><a href="#" class="ativo">Chef</a></li>
                    <li><a href="#">Curiosidades</a></li>
                    <li><a href="#">Catálogo</a></li>
                    <li><a href="#">Cursos</a></li>
                    <li><a href="#">Newsletter</a></li>
                    <li><a href="#">Mais</a></li>
                </ul>
            </nav>

            <div class="acessibilidade" aria-label="Ferramentas de acessibilidade">
                <ul class="teste">
                    <li>
                        <img class="imgacss" src="img/acessibilidade.png" alt="Acessibilidade">
                        <ul class="dropdown">
                            <li><img id="alternar-contraste" class="icone" src="./img/ico-altocontraste.png"
                                    alt="Contraste"></li>
                            <li><img id="aumentar-texto" class="icone" src="./img/ico-amais.png" alt="Aumentar texto">
                            </li>
                            <li><img id="diminuir-texto" class="icone" src="./img/ico-amenos.png" alt="Diminuir texto">
                            </li>
                            <li><img id="libras" class="icone" src="./img/ico-libras.png" alt="Libras"></li>
                            <li><img id="preto-e-branco" class="icone" src="./img/ico-pretobranco.png"
                                    alt="Preto e branco"></li>
                            <li><img id="comando-de-voz" class="icone" src="./img/ico-voz.png" alt="Comando de voz">
                            </li>
                        </ul>
                    </li>
                </ul>

                <!--<button class="darkmode" id="toggleTema" title="Alternar tema"><img src="./img/lua-crescente.png" alt=""></button> -->
                <!--<button class="alertamode" id="alerta" title="Ajuda de acessibilidade"><img src="./img/alerta.png" alt=""></button> -->
                <img class="modes" id="toggleTema" src="./img/lua-crescente.png" alt="">
                <img class="modes" id="alerta" src="./img/alerta.png">
                <img class="modes" id="shop" src="./img/shopping-bag.png">
            </div>
        </div>
    </div>

    <main class="catalog-main" role="main">
        <section class="catalog-controls" aria-label="Controles do catálogo">
            <div class="controls-inner">
                <div class="control-block">
                    <label class="label">Ordenar por:</label>
                    <button id="sortBtn" class="pill pill-sort" aria-pressed="false" title="Ordenar por preço">
                        <span id="sortText">Preço Maior ao menor</span>
                        <span class="icon sort-svg" aria-hidden="true">
                            <!-- small icon -->
                            <svg viewBox="0 0 24 24" width="1.1rem" height="1.1rem" fill="none" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h13M3 12h9M3 18h5" />
                            </svg>
                        </span>
                    </button>
                </div>

                <div class="control-block">
                    <label class="label">Filtrar por:</label>
                    <div class="pill select-pill">
                        <select id="categorySelect" aria-label="Filtrar por categoria">
                            <option value="all">Categoria</option>
                            <!-- JS injeta as opções -->
                        </select>
                        <span class="icon caret" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="1.1rem" height="1.1rem" fill="none" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 9l6 6 6-6"></path>
                            </svg>
                        </span>
                    </div>
                </div>

                <div class="view-toggle" title="Alternar visual" aria-hidden="false">
                    <button id="toggleViewBtn" class="icon-btn" aria-pressed="false">
                        <svg id="gridIcon" viewBox="0 0 24 24" width="1.3rem" height="1.3rem" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="8" height="8" />
                            <rect x="13" y="3" width="8" height="8" />
                            <rect x="3" y="13" width="8" height="8" />
                            <rect x="13" y="13" width="8" height="8" />
                        </svg>
                        <svg id="listIcon" viewBox="0 0 24 24" width="1.3rem" height="1.3rem" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            style="display:none">
                            <path d="M8 6h13M8 12h13M8 18h13" />
                            <circle cx="3.5" cy="6" r="1.5" />
                            <circle cx="3.5" cy="12" r="1.5" />
                            <circle cx="3.5" cy="18" r="1.5" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <section id="catalogList" class="catalog-list" aria-live="polite">
            <!-- cards no JS -->
        </section>
    </main>
    <footer>
        <p>© 2025 Inescafé - Todos os direitos reservados.</p>
    </footer>

    <script src="./script.js"></script>
    <script src="./script_catalogo_cursos.js"></script>
</body>

</html>
